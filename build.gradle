plugins {
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'io.javafast.core'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.apache.groovy:groovy-bom:5.0.2')
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.13'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

String jmhIncludes = findProperty("jmh.includes")
jmh {
    if (jmhIncludes != null) {
        includes = [jmhIncludes]
    }
    warmupIterations = 2
    iterations = 5
    fork = 1
    resultFormat = 'JSON'
    profilers = ['gc']
    jvmArgsAppend = ['-XX:+UseG1GC']
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
    // set test properties
    systemProperty 'test.logger', System.getProperty('test.logger', 'true')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}
