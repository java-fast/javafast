plugins {
    id 'java'
    id 'groovy'
}

group = 'io.javafast.core'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.apache.groovy:groovy-bom:5.0.2')
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.13'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
    // carry all system properties starting with "test.*" to test instance
    systemProperties(System.properties.findAll { k, v -> k.toString().startsWith("test.")} as Map<String, ? extends Object>)
}
